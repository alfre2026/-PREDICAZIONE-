<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141C17">
<title>Filo — il filo del discorso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --carta:#EAEBE4; --carta-alta:#F4F5EF; --inchiostro:#1B241E; --tenue:#5C6659;
  --filo:#AE8B3D; --nastro:#8C2F39; --bordo:#D2D4C7;
  --buio:#141C17; --buio-alto:#1B2620; --chiaro:#EDEDE4; --oro:#D9C48A; --spento:#8C9789;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--carta);color:var(--inchiostro);font:400 17px/1.55 var(--serif);-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--filo);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ ARCHIVIO ============ */
.schermo{max-width:720px;margin:0 auto;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
.masthead{padding:calc(34px + env(safe-area-inset-top)) 0 24px;border-bottom:1px solid var(--bordo)}
.masthead h1{margin:0;font:700 40px/.95 var(--serif);letter-spacing:-.03em}
.masthead h1 em{font-style:italic;font-weight:400;color:var(--filo)}
.masthead p{margin:10px 0 0;font:400 15px/1.5 var(--sans);color:var(--tenue);max-width:34ch}
.scheda{display:block;width:100%;text-align:left;padding:17px 0;border-bottom:1px solid var(--bordo)}
.scheda h2{margin:0;font:600 20px/1.25 var(--serif)}
.scheda .meta{margin-top:5px;font:400 13px/1.4 var(--sans);color:var(--tenue)}
.scheda .passo{color:var(--nastro)}
.vuoto{margin:24px 0;padding:22px;border:1px dashed var(--bordo);border-radius:14px;background:var(--carta-alta)}
.vuoto p{margin:0 0 14px;font:400 16px/1.5 var(--serif);color:var(--tenue)}
.btn{font:500 15px/1 var(--sans);padding:13px 18px;border-radius:11px;background:var(--inchiostro);color:var(--carta-alta);display:inline-flex;align-items:center;gap:8px}
.btn.chiaro{background:var(--carta-alta);color:var(--inchiostro);border:1px solid var(--bordo)}
.btn.oro{background:var(--filo);color:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5}
.minuto{font:500 13px/1 var(--sans);color:var(--tenue);padding:10px 12px;border-radius:9px;border:1px solid var(--bordo);background:var(--carta-alta)}
.fila-b{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 8px}
.allerta{margin:14px 0;padding:11px 13px;border-radius:10px;background:#FBF3F3;border:1px solid #E6CFD1;font:400 13.5px/1.45 var(--sans);color:#7A2D35}

/* ============ PULPITO ============ */
.pulpito{position:fixed;inset:0;z-index:10;background:var(--buio);color:var(--chiaro);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.alto{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid rgba(217,196,138,.22)}
.conta{font:600 13px/1 var(--sans);color:var(--oro);letter-spacing:.02em;padding:6px 8px 6px 0}
.orolo{font:500 13px/1 var(--sans);color:var(--spento);padding:6px 4px}
.alto .sp{margin-left:auto}
.tasto-alto{font:500 13px/1 var(--sans);color:var(--spento);padding:8px 4px}
.tasto-alto.acceso{color:var(--oro)}
.foglio{flex:1;overflow-y:auto;padding:24px 18px 22px;-webkit-overflow-scrolling:touch}
.numero{display:block;font:600 12px/1 var(--sans);color:var(--oro);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.pulpito h2{margin:0 0 20px;font:700 30px/1.18 var(--serif);letter-spacing:-.02em;color:#F3F3EA}
.progresso{display:flex;gap:4px;padding:0 16px 10px}
.progresso i{flex:1;height:3px;border-radius:2px;background:rgba(217,196,138,.22)}
.progresso i.on{background:var(--oro)}
.basso{display:flex;gap:9px;padding:11px 16px 15px;border-top:1px solid rgba(217,196,138,.22)}
.basso button{flex:1;padding:15px 8px;border-radius:12px;border:1px solid rgba(217,196,138,.3);
  color:var(--chiaro);font:500 15px/1 var(--sans);background:rgba(255,255,255,.03)}
.basso button:disabled{opacity:.3}
.basso .stretto{flex:0 0 auto;padding:15px 15px}

/* ---- voci ---- */
.voce-r{display:flex;align-items:flex-start;gap:11px;margin:0 0 13px;border-radius:9px}
.voce-r>span{flex:1;min-width:0;word-break:break-word}
.voce-r .pallino{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7;margin:.62em 0 0;flex:none}
.voce-r a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.t-titolo{font:700 28px/1.2 var(--serif);letter-spacing:-.02em;margin-top:24px}
.t-titolo:first-child{margin-top:0}
.t-voce{font:400 24px/1.4 var(--serif)}
.t-testo{font:400 18px/1.58 var(--serif);opacity:.82}
.grasso{font-weight:700}
.con-sfondo{padding:10px 13px}
.vuota{opacity:.45;font-style:italic}
.c-oro{color:#E3C87E} .c-rosa{color:#EDA3AA} .c-verde{color:#9AD3A6}
.c-azzurro{color:#9CC5EA} .c-viola{color:#C6AEEA} .c-arancio{color:#F0B183}
.s-oro{background:rgba(201,169,78,.17)} .s-rosa{background:rgba(178,68,80,.18)}
.s-verde{background:rgba(76,154,99,.17)} .s-azzurro{background:rgba(74,130,196,.18)}
.s-viola{background:rgba(138,102,200,.18)} .s-arancio{background:rgba(210,118,47,.18)}

/* ---- appunti ---- */
.appunti{margin-top:26px;padding-top:18px;border-top:1px solid rgba(217,196,138,.22)}
.appunti .nota-letta{font:400 18px/1.6 var(--serif);color:#C4CBC0;margin:0 0 16px}
.appunti .nota-letta p{margin:0 0 .5em}
.appunti .nota-letta ul{list-style:none;margin:.15em 0 .5em;padding:0}
.appunti .nota-letta li{position:relative;padding-left:16px;margin:0 0 .3em}
.appunti .nota-letta li::before{content:'';position:absolute;left:2px;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--oro)}
.appunti .forte{font-weight:700;color:#DDE2D8}
.appunti a{color:#EDA3AA;word-break:break-word}
.rif-v{display:inline-block;font:600 15px/1.35 var(--sans);color:#EDA3AA;
  border-bottom:1.5px solid rgba(237,163,170,.5);text-decoration:none;margin:0 0 6px}

/* ---- modifica ---- */
.pulpito textarea,.pulpito input[type=text]{width:100%;display:block;background:rgba(255,255,255,.05);
  color:#F3F3EA;border:1px solid rgba(217,196,138,.34);border-radius:10px;padding:11px 13px;
  resize:none;overflow:hidden;font:400 17px/1.55 var(--serif)}
.titolo-edit{font:700 27px/1.25 var(--serif)!important;letter-spacing:-.02em}
.campo-voce{font:400 21px/1.42 var(--serif)!important}
.etichetta{display:block;font:600 12px/1 var(--sans);color:var(--oro);letter-spacing:.05em;
  text-transform:uppercase;margin:28px 0 11px}
.blocco-voce,.blocco-edit{margin:0 0 6px}
.ctrl{display:flex;gap:6px;margin:5px 0 15px;flex-wrap:wrap}
.cbtn{font:500 12.5px/1 var(--sans);padding:9px 11px;border-radius:8px;
  border:1px solid rgba(217,196,138,.32);background:rgba(255,255,255,.04);color:#BFC7BB}
.cbtn:disabled{opacity:.32}
.cbtn.rosso{color:#E9A7AE}
.cbtn.forte{color:var(--oro);border-color:rgba(217,196,138,.6)}
.fila-e{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vuoto-scuro{color:var(--spento);font:400 18px/1.5 var(--serif);margin:22px 0 0}

/* ============ PANNELLI ============ */
.velo{position:fixed;inset:0;z-index:60;background:rgba(10,15,12,.62);display:flex;align-items:flex-end}
.pannello{background:var(--carta);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.pannello h3{margin:0 0 4px;font:600 21px/1.25 var(--serif)}
.pannello p{margin:0 0 14px;font:400 14px/1.5 var(--sans);color:var(--tenue)}
.pannello textarea{width:100%;min-height:150px;border:1px solid var(--bordo);border-radius:11px;
  padding:12px;background:#fff;font:400 15px/1.5 var(--serif);resize:vertical}
.pannello input[type=text],.pannello input[type=password],.pannello input[type=date]{
  width:100%;border:1px solid var(--bordo);border-radius:10px;padding:11px 12px;background:#fff;
  font:400 15px/1.3 var(--sans)}
.fila{display:flex;gap:8px;margin-top:16px}
.fila .btn{flex:1;justify-content:center}
.menu{display:flex;flex-direction:column}
.menu button{text-align:left;padding:15px 4px;border-bottom:1px solid var(--bordo);font:400 16px/1.3 var(--serif)}
.menu button:last-child{border-bottom:none}
.menu button.pericolo{color:var(--nastro)}
.menu button.primo{color:var(--filo);font-weight:600}
.menu button:disabled{opacity:.4}
.gruppo{margin:0 0 18px}
.etich{display:block;font:600 11.5px/1 var(--sans);color:var(--tenue);letter-spacing:.04em;
  text-transform:uppercase;margin:0 0 8px}
.segm{display:flex;gap:6px}
.segm button{flex:1;padding:12px 6px;border-radius:9px;border:1px solid var(--bordo);
  background:var(--carta-alta);font:500 14px/1 var(--sans);color:var(--tenue)}
.segm button.on{border-color:var(--filo);background:#fff;color:var(--inchiostro);box-shadow:inset 0 0 0 1px var(--filo)}
.tavolozza{display:flex;gap:9px;flex-wrap:wrap}
.pastello{width:40px;height:40px;border-radius:50%;border:2px solid transparent;position:relative}
.pastello.on{border-color:var(--inchiostro)}
.pastello.def{background:var(--carta);box-shadow:inset 0 0 0 1px var(--tenue)}
.pastello.def::after{content:'⊘';position:absolute;inset:0;display:grid;place-items:center;color:var(--tenue);font-size:15px}
.sw-oro{background:#C9A94E} .sw-rosa{background:#B24450} .sw-verde{background:#4C9A63}
.sw-azzurro{background:#4A82C4} .sw-viola{background:#8A66C8} .sw-arancio{background:#D2762F}
.tavolozza.tenue .pastello{opacity:.55}
.tavolozza.tenue .pastello.on{opacity:1}
.riga-r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bordo)}
.riga-r .tit{flex:1;min-width:0;font:400 15px/1.35 var(--serif);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
select.posiz{flex:none;font:600 13px/1 var(--sans);color:var(--inchiostro);background:var(--carta-alta);
  border:1px solid var(--bordo);border-radius:9px;padding:10px 8px}

.avviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:80;background:#0E1512;color:var(--chiaro);border:1px solid rgba(217,196,138,.3);
  padding:12px 18px;border-radius:11px;font:500 14px/1.35 var(--sans);max-width:88vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ==================================================================
   1. MEMORIA — archivio e chiave restano separati
   ================================================================== */
const K_DATI = "filo:prediche:v1";
const K_CHIAVE = "filo:chiave:v1";
let salvataggioOk = true;

async function leggi(k){
  try{ if(window.storage && window.storage.get){ const r = await window.storage.get(k); if(r && r.value) return r.value; } }catch(e){}
  try{ return localStorage.getItem(k); }catch(e){ return null; }
}
async function scrivi(k, v){
  let ok = false;
  try{ if(window.storage && window.storage.set){ await window.storage.set(k, v); ok = true; } }catch(e){}
  if(!ok){ try{ localStorage.setItem(k, v); ok = true; }catch(e){} }
  return ok;
}

let db = { versione:2, prediche:[] };
let conf = { chiave:"", modello:"claude-sonnet-5" };

let vista = "archivio";
let apertaId = null, slide = 0;
let modifica = false, mostraAppunti = false;
let inizio = null, tick = null;

/* ==================================================================
   2. UTILITÀ
   ================================================================== */
const app = document.getElementById("app");
const $ = s => document.querySelector(s);
const nuovoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RE_URL = /https?:\/\/[^\s<>"']+/g;
const HA_URL = /https?:\/\/[^\s<>"']+/;

function dataIt(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
}
function oggiIso(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

let tSalva = null;
function segna(){
  clearTimeout(tSalva);
  tSalva = setTimeout(async ()=>{
    salvataggioOk = await scrivi(K_DATI, JSON.stringify(db));
    if(!salvataggioOk) avvisa("Salvataggio non riuscito — esporta il lavoro");
  }, 350);
}

let tAvviso = null;
function avvisa(testo, durata){
  const v = $(".avviso"); if(v) v.remove();
  const el = document.createElement("div");
  el.className = "avviso"; el.textContent = testo;
  document.body.appendChild(el);
  clearTimeout(tAvviso);
  tAvviso = setTimeout(()=>el.remove(), durata || 2800);
}

function cresci(el){ if(!el) return; el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function cresciTutte(){ document.querySelectorAll("textarea.auto").forEach(cresci); }

async function copia(testo){
  try{ await navigator.clipboard.writeText(testo); avvisa("Copiato"); return true; }catch(e){}
  const t = document.createElement("textarea");
  t.value = testo; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  t.remove();
  avvisa(ok ? "Copiato" : "Copia non riuscita");
  return ok;
}

/* ==================================================================
   3. MODELLO
   ================================================================== */
function nuovaPredica(){
  return { id:nuovoId(), titolo:"", passo:"", data:oggiIso(), creata:Date.now(), punti:[nuovoPunto()] };
}
function nuovoPunto(){
  return { id:nuovoId(), titolo:"", blocchi:[nuovoBlocco("nota")], scaletta:[] };
}
function nuovoBlocco(tipo){
  return tipo === "versetto"
    ? { id:nuovoId(), tipo:"versetto", grezzo:"", aperto:false }
    : { id:nuovoId(), tipo:"nota", testo:"" };
}
function nuovaVoce(){
  return { testo:"", url:"", vers:false, tipo:"voce", colore:"", sfondo:"", grassetto:false };
}
function sistemaVoce(v){
  if(!v.tipo) v.tipo = "voce";
  if(v.colore === undefined) v.colore = v.vers ? "rosa" : "";
  if(v.sfondo === undefined) v.sfondo = "";
  if(v.grassetto === undefined) v.grassetto = false;
  if(v.url === undefined) v.url = "";
  return v;
}
const corrente = () => db.prediche.find(p => p.id === apertaId);
const puntoOra = () => { const p = corrente(); return p ? p.punti[Math.max(0,Math.min(slide,p.punti.length-1))] : null; };
const trovaPunto = id => { const p = corrente(); return p ? p.punti.find(x=>x.id===id) : null; };
const trovaBlocco = (pid,bid) => { const pt = trovaPunto(pid); return pt ? pt.blocchi.find(b=>b.id===bid) : null; };
const puntoVuoto = pt => !pt.blocchi.some(b => (b.tipo==="nota" ? (b.testo||"") : (b.grezzo||"")).trim());

/* ==================================================================
   4. VERSETTI
   ================================================================== */
function leggiVersetto(grezzo){
  const t = (grezzo||"").trim();
  if(!t) return {rif:"", testo:"", url:""};
  const m = t.match(RE_URL);
  const url = m ? m[0] : "";
  const corpo = t.replace(RE_URL,"").trim();
  const righe = corpo.split("\n").map(r=>r.trim()).filter(Boolean);
  let rif = righe[0] || "", testo = righe.slice(1).join("\n").trim();
  if(righe.length === 1){
    const mm = corpo.match(/^([^\[]{0,70}?\d{1,3}[:,]\s?\d{1,3}(?:\s?[-–]\s?\d{1,3})?(?:\s+[A-Za-z0-9]{2,8})?)\s*([\s\S]*)$/);
    if(mm && mm[2] && mm[2].trim().length > 12){ rif = mm[1].trim(); testo = mm[2].trim(); }
  }
  return {rif:rif.replace(/^[«"']|[»"']$/g,"").trim(), testo, url};
}
function linkVersetto(v){
  if(v.url) return v.url;
  if(v.rif) return "https://www.bible.com/search/bible?q=" + encodeURIComponent(v.rif);
  return "";
}
function riferimenti(pt){
  return pt.blocchi.filter(b=>b.tipo==="versetto")
    .map(b=>leggiVersetto(b.grezzo)).filter(v=>v.rif);
}

/* ==================================================================
   5. RESA DEL TESTO
   ================================================================== */
function evidenzia(t){ return t.replace(/\b[A-ZÀ-Ú]{4,}\b/g, w => '<b class="forte">'+w+'</b>'); }
function linkifica(s){
  const pezzi = []; const re = new RegExp(RE_URL.source,"g");
  let u = 0, m;
  while((m = re.exec(s))){
    pezzi.push(evidenzia(esc(s.slice(u, m.index))));
    pezzi.push('<a href="'+esc(m[0])+'" target="_blank" rel="noopener">'+esc(m[0].replace(/^https?:\/\//,"").slice(0,46))+'</a>');
    u = m.index + m[0].length;
  }
  pezzi.push(evidenzia(esc(s.slice(u))));
  return pezzi.join("");
}
function notaRender(testo){
  const righe = (testo||"").split("\n");
  let out = "", lista = false;
  for(const r0 of righe){
    const r = r0.trim();
    if(!r){ if(lista){ out += "</ul>"; lista = false; } continue; }
    if(/^[-*•·–>]\s?/.test(r)){
      if(!lista){ out += "<ul>"; lista = true; }
      out += "<li>" + linkifica(r.replace(/^[-*•·–>]\s?/,"")) + "</li>";
    }else{
      if(lista){ out += "</ul>"; lista = false; }
      out += "<p>" + linkifica(r) + "</p>";
    }
  }
  if(lista) out += "</ul>";
  return out || '<p class="vuota">Nota vuota</p>';
}

const COLORI = [
  {id:"",nome:"Predefinito"},{id:"oro",nome:"Oro"},{id:"rosa",nome:"Rosso"},{id:"verde",nome:"Verde"},
  {id:"azzurro",nome:"Azzurro"},{id:"viola",nome:"Viola"},{id:"arancio",nome:"Arancio"}
];
function classiVoce(v){
  return ["voce-r","t-"+(v.tipo||"voce"), v.colore?"c-"+v.colore:"",
          v.sfondo?"s-"+v.sfondo+" con-sfondo":"", v.grassetto?"grasso":""].filter(Boolean).join(" ");
}
function voceLetta(v){
  const dentro = v.url
    ? '<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(v.testo)+'</a>'
    : (esc(v.testo) || '<i class="vuota">voce vuota</i>');
  return '<div class="'+classiVoce(v)+'">'
    + ((v.tipo||"voce")==="voce" ? '<i class="pallino"></i>' : "")
    + '<span>'+dentro+'</span></div>';
}
function voceScritta(pid,k,tot,v){
  return `<div class="blocco-voce">
    <textarea class="auto campo-voce" rows="1" data-campo="voce" data-p="${pid}" data-i="${k}"
      placeholder="parola chiave, titolo, o versetto incollato da YouVersion">${esc(v.testo)}</textarea>
    <div class="ctrl">
      <button class="cbtn" data-az="voce-su" data-p="${pid}" data-i="${k}" ${k===0?"disabled":""}>↑</button>
      <button class="cbtn" data-az="voce-giu" data-p="${pid}" data-i="${k}" ${k===tot-1?"disabled":""}>↓</button>
      <button class="cbtn forte" data-az="voce-stile" data-p="${pid}" data-i="${k}">Stile</button>
      ${v.url ? `<a class="cbtn" href="${esc(v.url)}" target="_blank" rel="noopener">Apri</a>` : ""}
      <button class="cbtn rosso" data-az="voce-togli" data-p="${pid}" data-i="${k}">Togli</button>
    </div>
  </div>`;
}

/* ==================================================================
   6. IMPORTAZIONE DA WHATSAPP
   ================================================================== */
const RE_MSG = /^\[?(\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?),?\s+(\d{1,2}:\d{2}(?::\d{2})?)\s?(?:[APap]\.?[Mm]\.?)?\]?\s*(?:[-–]\s*)?([^:\n]{1,60}?):\s?([\s\S]*)$/;
const RE_SEGNO = /^\s*(\d{1,2})(?:\uFE0F)?\u20E3\s*$|^\s*(\d{1,2})\s*[.)°]?\s*$/;

function importaWhatsApp(testo){
  const messaggi = [];
  for(const l of (testo||"").split(/\r?\n/)){
    const m = l.match(RE_MSG);
    if(m) messaggi.push(m[4].trim());
    else if(messaggi.length) messaggi[messaggi.length-1] += "\n" + l;
    else if(l.trim()) messaggi.push(l.trim());
  }
  const puliti = messaggi.map(m=>m.trim()).filter(m=>m && !/^(<Media omessi>|<Media omitted>|null)$/i.test(m));
  const punti = []; let cur = null, attesa = false;
  const apri = ()=>{ cur = nuovoPunto(); cur.blocchi = []; punti.push(cur); };

  for(const msg of puliti){
    if(RE_SEGNO.test(msg)){ apri(); attesa = true; continue; }
    if(!cur){ apri(); attesa = true; }
    if(attesa && msg.length <= 120 && msg.split("\n").length === 1 && !HA_URL.test(msg)){
      cur.titolo = msg; attesa = false; continue;
    }
    attesa = false;
    const versetto = (/bible\.com|youversion/i.test(msg) && HA_URL.test(msg))
      || /^\S.{0,60}\d{1,3}[:,]\d{1,3}[\s\S]*\[\d+\]/.test(msg);
    if(versetto){ const b = nuovoBlocco("versetto"); b.grezzo = msg; cur.blocchi.push(b); }
    else { const b = nuovoBlocco("nota"); b.testo = msg; cur.blocchi.push(b); }
  }
  punti.forEach((p,i)=>{
    if(!p.blocchi.length) p.blocchi.push(nuovoBlocco("nota"));
    if(!p.titolo){
      const v = p.blocchi.find(b=>b.tipo==="versetto");
      const n = p.blocchi.find(b=>b.tipo==="nota" && (b.testo||"").trim());
      if(v) p.titolo = leggiVersetto(v.grezzo).rif;
      else if(n) p.titolo = n.testo.split(/[.!?\n]/)[0].trim().slice(0,70);
      if(!p.titolo) p.titolo = "Punto " + (i+1);
    }
  });
  return punti;
}

/* ==================================================================
   7. SCALETTA — la scrive Claude
   ================================================================== */
function testoDelPunto(pt){
  return pt.blocchi.map(b=>{
    if(b.tipo === "nota") return (b.testo||"").trim();
    const v = leggiVersetto(b.grezzo);
    return [v.rif, v.testo].filter(Boolean).join("\n");
  }).filter(Boolean).join("\n\n");
}

function istruzioni(pt){
  const rif = riferimenti(pt).map(v=>v.rif);
  return [
"Sei l'assistente di un predicatore. Dagli appunti di UN punto della predicazione ricava una scaletta di parole chiave da leggere dal pulpito.",
"",
"Regole:",
"- da 4 a 8 voci, nell'ordine in cui il discorso si svolge;",
"- ogni voce brevissima, al massimo 8 parole, telegrafica ma comprensibile a colpo d'occhio;",
"- devi cogliere il RAGIONAMENTO del testo, non le parole più ripetute: distingui la tesi dall'esempio che la illustra, e tieni la tesi;",
"- usa le parole del predicatore dove puoi, non riscriverlo in linguaggio tuo;",
"- gli appunti sono dettati a voce e contengono errori ed espressioni storpiate: ricava il senso voluto;",
"- non aggiungere concetti che negli appunti non ci sono;",
"- tipo TITOLO: la tesi del punto, da annunciare (al massimo una, di solito la prima); tipo VOCE: punto elenco normale; tipo TESTO: precisazione secondaria;",
rif.length ? "- se un riferimento biblico va richiamato mettilo come voce a sé, scrivendolo esattamente così: " + rif.join(" | ") : null,
"",
"Rispondi SOLO con questo formato, una voce per riga, senza altro testo:",
"# per un titolo",
"- per una voce",
"> per una precisazione",
"",
"Appunti del punto" + (pt.titolo ? ' "'+pt.titolo+'"' : "") + ":",
testoDelPunto(pt)
  ].filter(x=>x!==null).join("\n");
}

function leggiScaletta(risposta, pt){
  const rif = riferimenti(pt);
  const voci = [];
  for(let riga of (risposta||"").split("\n")){
    riga = riga.trim();
    if(!riga || /^```/.test(riga)) continue;
    let tipo = "voce", testo = riga;
    if(/^#+\s*/.test(riga)){ tipo = "titolo"; testo = riga.replace(/^#+\s*/,""); }
    else if(/^>\s*/.test(riga)){ tipo = "testo"; testo = riga.replace(/^>\s*/,""); }
    else if(/^[-*•·]\s*/.test(riga)){ testo = riga.replace(/^[-*•·]\s*/,""); }
    else if(/^\d{1,2}[.)]\s*/.test(riga)){ testo = riga.replace(/^\d{1,2}[.)]\s*/,""); }
    testo = testo.replace(/^["'«]|["'»]$/g,"").trim();
    if(!testo || /^(voci|scaletta)\s*:?$/i.test(testo)) continue;
    const v = nuovaVoce();
    v.testo = testo; v.tipo = tipo;
    const trovato = rif.find(r => testo.toLowerCase().includes(r.rif.toLowerCase())
      || r.rif.toLowerCase().includes(testo.toLowerCase()));
    if(trovato){ v.url = linkVersetto(trovato); v.vers = true; v.colore = "rosa"; }
    voci.push(v);
  }
  return voci.slice(0,10);
}

async function chiediAClaude(testo){
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": conf.chiave,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({
      model: conf.modello || "claude-sonnet-5",
      max_tokens: 1000,
      messages:[{role:"user", content: testo}]
    })
  });
  if(!r.ok){
    let det = "";
    try{ const j = await r.json(); det = (j.error && j.error.message) || ""; }catch(e){}
    if(r.status === 401) throw new Error("Chiave API non valida o scaduta");
    if(r.status === 429) throw new Error("Troppe richieste, riprova tra un minuto");
    if(/credit balance/i.test(det)) throw new Error("Credito esaurito sulla console Anthropic");
    throw new Error("Errore " + r.status + (det ? ": " + det.slice(0,90) : ""));
  }
  const dati = await r.json();
  return (dati.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n");
}

async function generaPunto(pt){
  const voci = leggiScaletta(await chiediAClaude(istruzioni(pt)), pt);
  if(voci.length) pt.scaletta = voci;
  return voci.length;
}

/* ==================================================================
   8. TESTO CONDIVISIBILE
   ================================================================== */
function scalettaTesto(p){
  const r = [(p.titolo||"Senza titolo").toUpperCase()];
  const sotto = [p.passo, dataIt(p.data)].filter(Boolean).join("  ·  ");
  if(sotto) r.push(sotto);
  r.push("");
  p.punti.forEach((pt,i)=>{
    r.push((i+1)+". "+(pt.titolo||"—"));
    (pt.scaletta||[]).forEach(v=>{
      const seg = v.tipo==="titolo" ? "   " : (v.tipo==="testo" ? "     " : "   • ");
      r.push(seg + v.testo + (v.url ? "  " + v.url : ""));
    });
    r.push("");
  });
  return r.join("\n").trim();
}
function appuntiTesto(p){
  const r = [(p.titolo||"Senza titolo").toUpperCase()];
  const sotto = [p.passo, dataIt(p.data)].filter(Boolean).join("  ·  ");
  if(sotto) r.push(sotto);
  r.push("");
  p.punti.forEach((pt,i)=>{
    r.push("── "+(i+1)+". "+(pt.titolo||"—"));
    r.push(testoDelPunto(pt)); r.push("");
  });
  return r.join("\n").trim();
}

      </div></div>
    <p style="margin-top:-6px">Sonnet coglie meglio il ragionamento. Haiku costa meno ed è più veloce. La chiave si crea su console.anthropic.com.</p>
    <div class="fila">
      <button class="btn chiaro" data-az="prova-chiave">Prova</button>
      <button class="btn oro" data-az="salva-chiave">Salva</button>
    </div>`);
}

/* ==================================================================
   11. EVENTI
   ================================================================== */
document.addEventListener("click", async (e)=>{
  const t = e.target.closest("[data-az]");
  if(!t) return;
  const az = t.dataset.az, pid = t.dataset.p, bid = t.dataset.b;
  const p = corrente();

  switch(az){
    case "nuova": {
      const n = nuovaPredica();
      db.prediche.push(n); apertaId = n.id; slide = 0; modifica = true; inizio = null;
      vista = "pulpito"; segna(); render(); panTestata();
      break;
    }
    case "apri": apertaId = t.dataset.id; slide = 0; modifica = false; mostraAppunti = false; inizio = null; vista = "pulpito"; render(); break;
    case "archivio": apertaId = null; vista = "archivio"; inizio = null; modifica = false; render(); break;

    case "modifica": modifica = true; renderPulpito(); cresciTutte(); break;
    case "fine": modifica = false; renderPulpito(); break;
    case "prec": slide--; renderPulpito(); cresciTutte(); break;
    case "succ": slide++; renderPulpito(); cresciTutte(); break;
    case "appunti": mostraAppunti = !mostraAppunti; renderPulpito(); break;
    case "azzera": inizio = Date.now(); break;
    case "vai": chiudiPannello(); slide = Number(t.dataset.i); renderPulpito(); cresciTutte(); break;

    case "pan-menu": panMenu(); break;
    case "pan-riordina": panRiordina(); break;
    case "pan-whatsapp": panWhatsApp(); break;
    case "pan-incolla": panIncolla(); break;
    case "pan-testata": panTestata(); break;
    case "impostazioni": panImpostazioni(); break;
    case "chiudi-pannello": chiudiPannello(); break;

    /* ---- punti ---- */
    case "punto-nuovo": {
      chiudiPannello();
      const n = nuovoPunto();
      p.punti.splice(slide+1, 0, n);
      slide = slide+1; modifica = true; segna(); render(); cresciTutte();
      break;
    }
    case "togli-punto": {
      if(p.punti.length === 1){ avvisa("Serve almeno un punto"); break; }
      if(!confirm("Eliminare il punto "+(slide+1)+" e i suoi appunti?")) break;
      p.punti.splice(slide,1);
      if(slide >= p.punti.length) slide = p.punti.length-1;
      chiudiPannello(); segna(); render();
      break;
    }
    case "su": case "giu": {
      const i = p.punti.findIndex(x=>x.id===pid);
      const j = az==="su" ? i-1 : i+1;
      if(j<0 || j>=p.punti.length) break;
      [p.punti[i],p.punti[j]] = [p.punti[j],p.punti[i]];
      if(slide===i) slide=j; else if(slide===j) slide=i;
      segna(); renderPulpito(); panRiordina();
      break;
    }

    /* ---- blocchi ---- */
    case "blocco-nota": case "blocco-versetto": {
      const pt = trovaPunto(pid);
      pt.blocchi.push(nuovoBlocco(az==="blocco-versetto" ? "versetto" : "nota"));
      segna(); renderPulpito(); cresciTutte();
      const campi = document.querySelectorAll('#foglio .blocco-edit textarea');
      const ult = campi[campi.length-1];
      if(ult){ ult.focus(); ult.scrollIntoView({block:"center"}); }
      break;
    }
    case "togli-blocco": {
      const pt = trovaPunto(pid);
      pt.blocchi = pt.blocchi.filter(b=>b.id!==bid);
      if(!pt.blocchi.length) pt.blocchi.push(nuovoBlocco("nota"));
      segna(); renderPulpito(); cresciTutte();
      break;
    }

    /* ---- voci ---- */
    case "voce-nuova": {
      const pt = trovaPunto(pid);
      pt.scaletta = pt.scaletta || [];
      pt.scaletta.push(nuovaVoce());
      segna(); renderPulpito(); cresciTutte();
      const c = document.querySelectorAll("#foglio .campo-voce");
      const ult = c[c.length-1]; if(ult){ ult.focus(); ult.scrollIntoView({block:"center"}); }
      break;
    }
    case "voce-togli": {
      trovaPunto(pid).scaletta.splice(Number(t.dataset.i),1);
      segna(); renderPulpito(); cresciTutte();
      break;
    }
    case "voce-su": case "voce-giu": {
      const pt = trovaPunto(pid), k = Number(t.dataset.i);
      const j = az==="voce-su" ? k-1 : k+1;
      if(j<0 || j>=pt.scaletta.length) break;
      [pt.scaletta[k],pt.scaletta[j]] = [pt.scaletta[j],pt.scaletta[k]];
      segna(); renderPulpito(); cresciTutte();
      break;
    }
    case "voce-stile": panStile(pid, Number(t.dataset.i)); break;
    case "set-tipo": case "set-colore": case "set-sfondo": case "set-grassetto": {
      const pt = trovaPunto(pid), i2 = Number(t.dataset.i);
      const v = sistemaVoce(pt.scaletta[i2]);
      if(az==="set-tipo") v.tipo = t.dataset.v;
      if(az==="set-colore") v.colore = t.dataset.v;
      if(az==="set-sfondo") v.sfondo = t.dataset.v;
      if(az==="set-grassetto") v.grassetto = t.dataset.v === "1";
      segna(); renderPulpito(); cresciTutte(); panStile(pid, i2);
      break;
    }

    /* ---- scaletta ---- */
    case "genera": {
      const pt = trovaPunto(pid);
      if(!conf.chiave){ chiudiPannello(); copiaPerClaude(pt); break; }
      if(puntoVuoto(pt)){ avvisa("Questo punto non ha appunti"); break; }
      t.disabled = true; t.textContent = "Claude sta leggendo…";
      try{
        const n = await generaPunto(pt);
        segna(); renderPulpito(); cresciTutte();
        avvisa(n ? "Scaletta pronta" : "Nessuna voce ricavata");
      }catch(err){
        renderPulpito(); cresciTutte();
        avvisa(err.message, 5000);
      }
      break;
    }
    case "genera-tutto": {
      if(!conf.chiave){ chiudiPannello(); panImpostazioni(); avvisa("Serve la chiave API"); break; }
      chiudiPannello();
      const da = p.punti.filter(x=>!puntoVuoto(x));
      let fatti = 0;
      for(let i=0;i<da.length;i++){
        avvisa("Claude sta leggendo il punto "+(i+1)+" di "+da.length+"…", 60000);
        try{ if(await generaPunto(da[i])) fatti++; }
        catch(err){ avvisa(err.message, 5000); break; }
      }
      segna(); renderPulpito();
      if(fatti) avvisa("Scaletta pronta per "+fatti+" punt"+(fatti===1?"o":"i"));
      break;
    }
    case "copia-per-claude": { chiudiPannello(); copiaPerClaude(puntoOra()); break; }
    case "fai-incolla": {
      const pt = trovaPunto(pid) || puntoOra();
      const voci = leggiScaletta($("#testo-sc").value, pt);
      if(!voci.length){ avvisa("Non ho trovato voci"); break; }
      pt.scaletta = voci;
      chiudiPannello(); segna(); renderPulpito(); cresciTutte();
      avvisa(voci.length+" voci inserite");
      break;
    }

    /* ---- importazioni ---- */
    case "fai-wa": {
      const punti = importaWhatsApp($("#testo-wa").value);
      if(!punti.length){ avvisa("Non ho trovato messaggi"); break; }
      if(p){
        p.punti = p.punti.filter(x=>!puntoVuoto(x) || (x.titolo||"").trim()).concat(punti);
        if(!p.punti.length) p.punti = punti;
        slide = p.punti.length - punti.length;
      }else{
        const n = nuovaPredica();
        n.punti = punti;
        const v = punti.map(x=>x.blocchi.find(b=>b.tipo==="versetto")).find(Boolean);
        if(v) n.passo = leggiVersetto(v.grezzo).rif;
        db.prediche.push(n); apertaId = n.id; slide = 0;
      }
      chiudiPannello(); vista = "pulpito"; modifica = false; inizio = null; segna(); render();
      avvisa(punti.length+" punti importati");
      break;
    }
    case "esporta": {
      chiudiPannello();
      const blob = new Blob([JSON.stringify(db,null,1)],{type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "filo-"+oggiIso()+".json";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      break;
    }
    case "importa": {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = "application/json,.json";
      inp.onchange = ()=>{
        const f = inp.files[0]; if(!f) return;
        const fr = new FileReader();
        fr.onload = ()=>{
          try{
            const d = JSON.parse(fr.result);
            if(!d || !Array.isArray(d.prediche)) throw 0;
            const noti = new Set(db.prediche.map(x=>x.id));
            let n = 0;
            d.prediche.forEach(x=>{ if(!noti.has(x.id)){ db.prediche.push(x); n++; } });
            sistemaTutto(); segna(); render();
            avvisa(n+" predicazioni aggiunte");
          }catch(err){ avvisa("File non leggibile"); }
        };
        fr.readAsText(f);
      };
      inp.click();
      break;
    }
    case "elimina-predica": {
      if(!confirm("Eliminare definitivamente questa predicazione?")) break;
      db.prediche = db.prediche.filter(x=>x.id!==p.id);
      apertaId = null; vista = "archivio"; chiudiPannello(); segna(); render();
      break;
    }
    case "copia-scaletta": chiudiPannello(); copia(scalettaTesto(p)); break;
    case "copia-appunti": chiudiPannello(); copia(appuntiTesto(p)); break;

    /* ---- chiave ---- */
    case "set-modello": conf.modello = t.dataset.v; salvaConf(); panImpostazioni(); break;
    case "salva-chiave": {
      conf.chiave = $("#campo-chiave").value.trim();
      await salvaConf(); chiudiPannello();
      avvisa(conf.chiave ? "Chiave salvata in questo telefono" : "Chiave rimossa");
      if(vista === "pulpito") renderPulpito();
      break;
    }
    case "prova-chiave": {
      const k = $("#campo-chiave").value.trim();
      if(!k){ avvisa("Scrivi prima la chiave"); break; }
      const vecchia = conf.chiave; conf.chiave = k;
      t.disabled = true; t.textContent = "Provo…";
      try{
        await chiediAClaude("Rispondi con la sola parola: pronto");
        avvisa("Funziona. Ora premi Salva.");
      }catch(err){ conf.chiave = vecchia; avvisa(err.message, 5000); }
      t.disabled = false; t.textContent = "Prova";
      break;
    }
  }
});

function copiaPerClaude(pt){
  copia(istruzioni(pt));
  avvisa("Copiato. Incollalo a Claude, poi torna qui con «Incolla la scaletta».", 5200);
}

async function salvaConf(){
  await scrivi(K_CHIAVE, JSON.stringify(conf));
}

/* ---- scrittura nei campi ---- */
document.addEventListener("input", (e)=>{
  const el = e.target, campo = el.dataset ? el.dataset.campo : null;
  if(!campo) return;
  const p = corrente();
  if(campo === "titolo"){ p.titolo = el.value; }
  else if(campo === "passo"){ p.passo = el.value; }
  else if(campo === "data"){ p.data = el.value; }
  else if(campo === "titolo-punto"){ trovaPunto(el.dataset.p).titolo = el.value; cresci(el); }
  else if(campo === "nota"){ trovaBlocco(el.dataset.p, el.dataset.b).testo = el.value; cresci(el); }
  else if(campo === "versetto"){ trovaBlocco(el.dataset.p, el.dataset.b).grezzo = el.value; cresci(el); }
  else if(campo === "voce"){
    sistemaVoce(trovaPunto(el.dataset.p).scaletta[Number(el.dataset.i)]).testo = el.value;
    cresci(el);
  }
  else if(campo === "voce-url"){
    const v = sistemaVoce(trovaPunto(el.dataset.p).scaletta[Number(el.dataset.i)]);
    v.url = el.value.trim(); v.vers = !!v.url;
  }
  else return;
  segna();
});

/* ---- il versetto incollato in una voce diventa cliccabile ---- */
document.addEventListener("focusout", (e)=>{
  const el = e.target;
  if(!el.dataset || el.dataset.campo !== "voce") return;
  const pt = trovaPunto(el.dataset.p); if(!pt) return;
  const v = pt.scaletta[Number(el.dataset.i)];
  if(!v || !HA_URL.test(v.testo||"")) return;
  const letto = leggiVersetto(v.testo);
  if(!letto.url) return;
  v.url = letto.url; v.vers = true; v.testo = letto.rif || v.testo.replace(RE_URL,"").trim();
  if(!v.colore) v.colore = "rosa";
  segna(); renderPulpito(); cresciTutte();
  avvisa("Versetto riconosciuto, ora è cliccabile");
});

document.addEventListener("focusin", (e)=>{
  const el = e.target;
  if(vista !== "pulpito" || !el.dataset || !el.dataset.campo) return;
  if(el.closest(".pannello")) return;
  setTimeout(()=>{ try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }catch(err){} }, 340);
});

document.addEventListener("change", (e)=>{
  const el = e.target;
  if(!el.dataset || el.dataset.campo !== "posizione") return;
  const p = corrente(); if(!p) return;
  const da = p.punti.findIndex(x=>x.id===el.dataset.p);
  const a = Number(el.value);
  if(da<0 || isNaN(a) || a===da) return;
  const [mosso] = p.punti.splice(da,1);
  p.punti.splice(a,0,mosso);
  slide = a;
  segna(); renderPulpito(); panRiordina();
  avvisa("Ora è il punto "+(a+1));
});

document.addEventListener("keydown", (e)=>{
  const c = e.target && e.target.dataset ? e.target.dataset.campo : null;
  if(e.key === "Enter" && c === "titolo-punto"){ e.preventDefault(); e.target.blur(); return; }
  if(vista !== "pulpito" || modifica) return;
  if(e.target && /TEXTAREA|INPUT/.test(e.target.tagName)) return;
  const p = corrente(); if(!p) return;
  if(e.key === "ArrowRight" && slide < p.punti.length-1){ slide++; renderPulpito(); }
  if(e.key === "ArrowLeft" && slide > 0){ slide--; renderPulpito(); }
});

let xT = null, yT = null;
document.addEventListener("touchstart", e=>{
  if(vista !== "pulpito" || modifica || $(".velo")) return;
  xT = e.touches[0].clientX; yT = e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend", e=>{
  if(vista !== "pulpito" || xT === null) return;
  const dx = e.changedTouches[0].clientX - xT, dy = e.changedTouches[0].clientY - yT;
  xT = null;
  if(Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
  const p = corrente(); if(!p) return;
  if(dx < 0 && slide < p.punti.length-1){ slide++; renderPulpito(); }
  if(dx > 0 && slide > 0){ slide--; renderPulpito(); }
},{passive:true});

window.addEventListener("resize", cresciTutte);

/* ==================================================================
   12. AVVIO
   ================================================================== */
function sistemaTutto(){
  db.prediche.forEach(p=>{
    p.punti = p.punti || [];
    p.punti.forEach(pt=>{
      pt.blocchi = pt.blocchi || [];
      pt.scaletta = (pt.scaletta || []).map(sistemaVoce);
      pt.blocchi.forEach(b=>{ if(b.tipo!=="versetto") b.tipo = "nota"; delete b.modifica; });
      delete pt.aperto;
    });
  });
}

(async function avvia(){
  const salvato = await leggi(K_DATI);
  if(salvato){ try{ const d = JSON.parse(salvato); if(d && Array.isArray(d.prediche)) db = d; }catch(e){} }
  const c = await leggi(K_CHIAVE);
  if(c){ try{ const d = JSON.parse(c); if(d) conf = Object.assign(conf, d); }catch(e){} }
  sistemaTutto();
  render();
})();
</script>
